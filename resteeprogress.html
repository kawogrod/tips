<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restee Progress - Goals and OKR</title>
    
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap" rel="stylesheet">
</head>
    <body class="bg-black text-white">
        <nav class="navbar icon-link p-3 w-100">
            <div class="navbar-brand"><span class="fs-3 logo">Restee</span> <span class="fw-medium text-white-50">progress</span></div>
            <button class="btn btn-sm btn-dark text-primary fw-semibold px-3 rounded-pill ms-auto">Pobierz</button>
        </nav>
        
        <div class="d-flex flex-column gap-4 py-4 px-3">
            <div class="d-flex flex-column gap-3 bg-dark rounded-4 p-3">
                <div>
                    <span class="badge bg-secondary-subtle me-auto">1/4</span>
                    <span class="fw-medium small">Napisać do 100 kawiarni na Instagramie o stworzenie darmowego menu</span>
                </div>
                <div class="progress" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: .5rem">
                  <div class="progress-bar" style="width: 25%"></div>
                </div>
                <div class="icon-link justify-content-between">
                    <span class="fw-medium small">25% - 7 ze 100</span>
                    <button class="btn btn-sm text-primary fw-medium p-0">Dodaj</button> 
                </div>
            </div>
            <div class="d-flex flex-column gap-3 bg-dark rounded-4 p-3">
                <span class="badge bg-secondary-subtle me-auto">1/4</span>
                <span class="fw-medium small">Opublikować 25 komentarzy polecających darmowy kreator</span>
                <div class="progress" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: .5rem">
                  <div class="progress-bar" style="width: 25%"></div>
                </div>
                <div class="icon-link justify-content-between">
                    <span class="fw-medium small">25% - 6 z 25</span>
                    <button class="btn btn-sm text-primary fw-medium p-0">Dodaj</button> 
                </div>
            </div>
            
            <div class="d-flex flex-column gap-3 bg-dark rounded-4 p-3">
                <span class="badge bg-secondary-subtle me-auto">1/4</span>
                <span class="fw-medium small">Dodaj 10 postów polecających darmowy kreator na grupach facebook'owych</span>
                <div class="progress" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: .5rem">
                  <div class="progress-bar" style="width: 25%"></div>
                </div>
                <div class="icon-link justify-content-between">
                    <span class="fw-medium small">25% - 2 z 10</span>
                    <button class="btn btn-sm text-primary fw-medium p-0">Dodaj</button> 
                </div>
            </div>
        </div>
        
    </body>
</html>
